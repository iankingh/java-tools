sourceSets {
	integrationTest {
		java.srcDir file('src/integrationTest/java')
		resources.srcDir file('src/integrationTest/resources')
		compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
		runtimeClasspath += output + compileClasspath
	}
}

configurations {
	integrationTestImplementation.extendsFrom testImplementation
	integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
	api "org.springframework.data:spring-data-redis:${rootProject.ext.springDataRedisVersion}"

	integrationTestImplementation "org.testcontainers:testcontainers:${rootProject.ext.testcontainersVersion}"
	integrationTestImplementation "org.testcontainers:junit-jupiter:${rootProject.ext.testcontainersVersion}"
	integrationTestImplementation 'io.lettuce:lettuce-core:7.8.0.RELEASE'
}

tasks.register('integrationTest', Test) {
	description = 'Runs Redis integration tests against Testcontainers or an explicit Redis host.'
	group = 'verification'
	testClassesDirs = sourceSets.integrationTest.output.classesDirs
	classpath = sourceSets.integrationTest.runtimeClasspath
	shouldRunAfter test
	useJUnitPlatform()
	outputs.upToDateWhen { false }
	outputs.doNotCacheIf('Requires a live Redis service on every invocation') { true }
	['host', 'port', 'database'].each { option ->
		def value = providers.systemProperty("redis.integration.${option}")
		if (value.isPresent()) {
			systemProperty "redis.integration.${option}", value.get()
		}
	}
	systemProperty 'java.io.tmpdir', layout.buildDirectory.get().asFile.absolutePath
}

tasks.register('redisIntegrationCoverage', JacocoReport) {
	dependsOn integrationTest
	executionData integrationTest
	sourceSets sourceSets.main
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.register('redisIntegrationCheck') {
	description = 'Runs real Redis tests, formatting, static analysis and integration coverage.'
	group = 'verification'
	dependsOn integrationTest, rootProject.tasks.named('spotlessCheck'), spotbugsMain, spotbugsIntegrationTest, redisIntegrationCoverage
}
