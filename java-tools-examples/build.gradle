plugins {
	id 'application'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

dependencies {
	implementation project(':java-tools-core')
	testImplementation platform("org.junit:junit-bom:${rootProject.ext.junitVersion}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
	mainClass = 'io.github.iankingh.javatools.examples.UtilityExamples'
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}
