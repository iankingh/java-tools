plugins {
	id 'base'
	id 'com.diffplug.spotless' version '8.10.1'
	id 'com.github.spotbugs' version '6.5.9' apply false
}

group = 'io.github.iankingh'
version = providers.gradleProperty('versionOverride').getOrElse('2.0.0-SNAPSHOT')

ext {
	jacksonVersion = '2.22.1'
	jaxbVersion = '4.0.9'
	jmsVersion = '3.1.0'
	junitVersion = '6.1.2'
	mockitoVersion = '5.23.0'
	poiVersion = '5.5.1'
	springDataRedisVersion = '4.1.0'
	testcontainersVersion = '1.21.4'
}

allprojects {
	group = rootProject.group
	version = rootProject.version

	repositories {
		mavenCentral()
	}
}

def libraryProjects = subprojects.findAll { it.name != 'java-tools-examples' }

configure(libraryProjects) {
	apply plugin: 'java-library'
	apply plugin: 'jacoco'
	apply plugin: 'maven-publish'
	apply plugin: 'com.github.spotbugs'

	spotbugs {
	    excludeFilter = rootProject.file('config/spotbugs/exclude.xml')
	}

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
		withJavadocJar()
		withSourcesJar()
	}

	dependencies {
		testImplementation platform("org.junit:junit-bom:${rootProject.ext.junitVersion}")
		testImplementation 'org.junit.jupiter:junit-jupiter'
		testImplementation "org.mockito:mockito-core:${rootProject.ext.mockitoVersion}"
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	}

	tasks.withType(JavaCompile).configureEach {
		options.encoding = 'UTF-8'
		options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
	}

	tasks.withType(Javadoc).configureEach {
		options.encoding = 'UTF-8'
		options.charSet = 'UTF-8'
		options.docEncoding = 'UTF-8'
		options.addStringOption('Xdoclint:all,-missing', '-quiet')
	}

	tasks.withType(Test).configureEach {
		useJUnitPlatform()
		testLogging {
			events 'failed', 'skipped'
			exceptionFormat = 'full'
		}
	}

	jacocoTestReport {
		dependsOn test
		reports {
			xml.required = true
			html.required = true
		}
	}

	check {
		dependsOn jacocoTestReport
		dependsOn spotbugsMain
		dependsOn spotbugsTest
	}

	publishing {
		publications {
			mavenJava(MavenPublication) {
				from components.java
				pom {
					name = project.name
					description = 'Modern Java 21 utility libraries with secure defaults.'
					url = 'https://github.com/iankingh/java-tools'
					licenses {
						license {
							name = 'MIT License'
							url = 'https://opensource.org/licenses/MIT'
						}
					}
					developers {
						developer {
							id = 'iankingh'
							name = 'Ian'
						}
					}
					scm {
						connection = 'scm:git:https://github.com/iankingh/java-tools.git'
						developerConnection = 'scm:git:ssh://git@github.com/iankingh/java-tools.git'
						url = 'https://github.com/iankingh/java-tools'
					}
				}
			}
		}
		repositories {
			maven {
				name = 'GitHubPackages'
				url = uri('https://maven.pkg.github.com/iankingh/java-tools')
				credentials {
					username = providers.environmentVariable('GITHUB_ACTOR').getOrNull()
					password = providers.environmentVariable('GITHUB_TOKEN').getOrNull()
				}
			}
		}
	}
}

spotless {
	java {
		target 'java-tools-*/src/**/*.java'
		googleJavaFormat().aosp()
		formatAnnotations()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
	format 'gradle', {
		target '*.gradle', 'java-tools-*/build.gradle'
		trimTrailingWhitespace()
		endWithNewline()
	}
	format 'misc', {
		target '*.md', '.github/**/*.yml', '.github/**/*.yaml', '**/*.properties'
		trimTrailingWhitespace()
		endWithNewline()
	}
}

tasks.named('check') {
	dependsOn spotlessCheck
	dependsOn subprojects.collect { "${it.path}:check" }
}

tasks.named('assemble') {
	dependsOn subprojects.collect { "${it.path}:assemble" }
}

tasks.register('publishAllToMavenLocal') {
	group = 'publishing'
	description = 'Publishes every library module to the local Maven repository.'
	dependsOn libraryProjects.collect { "${it.path}:publishToMavenLocal" }
}
